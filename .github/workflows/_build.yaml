name: _build (Reusable workflow)

on:
  workflow_call:
    inputs:
      build-project:
        description: Path to the project to build (if empty, null, or whitespace, builds the solution or the project in the current directory)
        type: string
        required: false

      runner-os:
        description: Runner OS
        type: string
        default: ubuntu-latest

      preprocessor-symbols:
        description: Preprocessor symbols to pass to the compiler (default - none)
        type: string
        default: ""

      job-index:
        description: >-
          The calling job's own matrix leg index (the caller's strategy.job-index -- this
          reusable workflow runs as its own job, with no matrix of its own, so it cannot read
          that context directly). Used only to name this leg's uploaded artifact uniquely.
        type: number
        default: 0

permissions:
  contents: read
  packages: read

env:
  # this must be the same across all jobs and steps below.
  # We must know where to find the artifacts and where to download/upload to/from across all jobs and steps here.
  ARTIFACTS_PATH: artifacts
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MINVERTAGPREFIX: ${{ vars.MINVERTAGPREFIX }}
  MINVERDEFAULTPRERELEASEIDENTIFIERS: ${{ vars.MINVERDEFAULTPRERELEASEIDENTIFIERS }}
  GH_TOKEN: ${{ github.token }}
  GH_ACTOR: ${{ github.actor }}
  VERBOSE: ${{ vars.VERBOSE || false }}

jobs:
  # Compile the project and optionally cache the built artifacts
  build:
    name: Build on ${{ inputs.runner-os }}
    runs-on: ${{ inputs.runner-os }}
    permissions:
      contents: read
      packages: read
    steps:
      # Clone the repository with full Git history for version calculation
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@big-bang

      - name: Setup .NET and the dependencies cache
        uses: vmelamed/vm2.DevOps/.github/actions/cache-dependencies@big-bang
        with:
          runner-os: ${{ inputs.runner-os }}
          github-actor: ${{ github.actor }}
          github-token: ${{ github.token }}

      - name: Build
        id: build
        shell: bash
        run: |
          build.sh \
              "${{ inputs.build-project }}" \
              --define "${{ inputs.preprocessor-symbols }}"

      - name: Detect SDK drift on failure
        if: failure()
        shell: bash
        env:
          REFRESH_WF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/RefreshLockFiles.yaml
        run: |
          if dotnet restore --locked-mode 2>&1 | grep -q "NU1004"; then
              {
                  echo "## ⚠️ Detected SDK version drift"
                  echo ""
                  echo "The NuGet lock files are stale — the runner's .NET SDK changed implicit"
                  echo "package versions (e.g. \`Microsoft.NET.ILLink.Tasks\`)."
                  echo ""
                  echo "**Fix (CI):** trigger the [Refresh Lock Files]($REFRESH_WF_URL) workflow"
                  echo "(scheduled every Monday 05:00 ET, or run manually via \`workflow_dispatch\`)."
                  echo ""
                  echo "**Fix your local development environment:**"
                  echo "\`\`\`"
                  echo "sudo apt upgrade dotnet-sdk-10.0"
                  echo "dotnet restore --force-evaluate"
                  echo "\`\`\`"
                  echo "Adjust the above for the OS .NET upgrade command and the runner's actual SDK version if not 10.0"
                  echo "Then commit and push the lockfiles."
              } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Make the compiled binaries and intermediate files available to the downstream jobs (test, benchmarks, pack) of this run.
      # Artifacts -- not the cache -- are the intra-run handoff mechanism: the cache service is designed for cross-run reuse and
      # gives no read-after-write guarantee, so a freshly saved entry may not be visible to a lookup seconds later (observed
      # 2026-06-11: 4/4 deterministic restore misses ~25s after a verified save).
      #
      # Scoped to this leg's own artifacts-project-name subfolder(s) (bin/obj), not the whole $ARTIFACTS_PATH tree: a leg's
      # build-project may be an individual project (one name) or a whole solution (one name per constituent project, since
      # build-projects may freely mix both), and `dotnet build` transitively rebuilds project references into the SAME
      # shared tree, so every leg that depends on another project would otherwise re-upload that project's output too,
      # duplicated across every dependent leg's own artifact.
      - name: Archive built artifacts
        shell: bash
        env:
          ARTIFACTS_PROJECT_NAMES: ${{ steps.build.outputs.artifacts-project-name }}
        run: |
          declare -a names
          mapfile -t names < <(jq -r '.[]' <<< "$ARTIFACTS_PROJECT_NAMES")

          declare -a dirs=()
          for name in "${names[@]}"; do
              bin_dir="$ARTIFACTS_PATH/bin/$name"
              obj_dir="$ARTIFACTS_PATH/obj/$name"
              [[ -d $bin_dir ]] || {
                  echo "::error::Build produced no output in $bin_dir/."
                  exit 1
              }
              dirs+=("$bin_dir" "$obj_dir")
          done
          tar czf built-artifacts.tar.gz --exclude='*.tmp' "${dirs[@]}"

      # Named by this matrix leg's own index, not by project/solution content: a leg may cover one project or several (a
      # whole solution), so there's no single clean name to embed here -- the index is always unique across the matrix
      # regardless of what a leg builds.
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: built-artifacts-${{ runner.os }}-${{ inputs.job-index }}-${{ github.run_id }}
          path: built-artifacts.tar.gz
