name: _release (Reusable workflow)

on:
  workflow_call:
    inputs:
      package-projects:
        description: >-
          JSON array of project/solution paths to package and publish, e.g. '["src/Project1/Project1.csproj", "src/Project2/Project2.csproj"]'.
          If empty array, auto-detects root .sln or .csproj files.
        type: string
        default: "[]"

      preprocessor-symbols:
        description: Preprocessor symbols to pass to the compiler
        type: string
        required: true

      minver-tag-prefix:
        description: "Prefix for git tags to be recognized by MinVer (default 'v')"
        type: string
        required: true

      reason:
        description: Reason for manual release
        type: string
        required: true

    secrets:
      RELEASE_PAT:
        description: >-
          PAT for a user listed as a bypass actor (e.g. Admin) in the branch ruleset protecting main.
          Required to push changelog commits and version tags directly to main.
        required: true

    outputs:
      artifact-ids:
        description: >-
          Comma-separated list of artifact IDs for the uploaded package artifacts, if any. Empty string if no artifacts were
          uploaded.
        value: ${{ jobs.collect-artifacts.outputs.artifact-ids }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERBOSE: ${{ vars.VERBOSE || false }}

jobs:
  compute-version:
    name: Compute Release Version
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.version.outputs.release-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
      reason: ${{ steps.version.outputs.reason }}
      needs-empty-commit: ${{ steps.version.outputs.needs-empty-commit }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          token: ${{ github.token }}

      # Clone only the scripts from vm2.DevOps, so that we can run the composite
      # action .github/actions/scripts/action.yaml for both local and external calls
      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Validate and compute release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          compute-release-version.sh \
              --minver-tag-prefix '${{ inputs.minver-tag-prefix }}' \
              --reason '${{ inputs.reason }}'

  changelog-and-tag:
    name: Update CHANGELOG.md and Create Release Tag
    runs-on: ubuntu-latest
    needs:
      - compute-version
    steps:
      - name: Checkout (full history on main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Update CHANGELOG.md and create release tag
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          [[ -n $RELEASE_PAT ]]       || error "secrets.RELEASE_PAT, or env.RELEASE_PAT, or RELEASE_PAT is not set"
          [[ -n $GITHUB_REPOSITORY ]] || error "github.repository(?), or env.GITHUB_REPOSITORY, or GITHUB_REPOSITORY is not set"
          exit_if_has_errors

          changelog-and-tag.sh \
              --tag "${{ needs.compute-version.outputs.release-tag }}" \
              --reason "${{ inputs.reason }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}" \
              --needs-empty-commit "${{ needs.compute-version.outputs.needs-empty-commit }}"

  # Build (only) each project and upload it as a workflow artifact. Publishing does NOT happen here: NuGet.org's
  # trusted-publishing OIDC trust policy validates the job_workflow_ref claim, which for a reusable workflow names
  # the workflow FILE that is running -- _release.yaml (in vm2.DevOps) -- not the repository that called it, so it
  # can never satisfy a trust policy scoped to the calling repo's own workflow file. The calling workflow downloads
  # these artifacts and does the actual NuGet login + push itself, where job_workflow_ref correctly matches its own
  # trust policy. See _prerelease.yaml for the same reasoning and shape.
  package-and-publish:
    name: Publish Release Package to NuGet server and/or Save Package Artifacts
    if: fromJSON(inputs.package-projects)[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - compute-version
      - changelog-and-tag
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.package-projects) }}
    steps:
      - name: Checkout release tag (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.release-tag }}
          fetch-tags: true
          fetch-depth: 0
          filter: tree:0

      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Setup .NET and the dependencies cache
        uses: vmelamed/vm2.DevOps/.github/actions/cache-dependencies@main
        with:
          runner-os: ubuntu-latest
          github-token: ${{ github.token }}
          github-actor: ${{ github.actor }}

      - name: Build package (release)
        id: package
        shell: bash
        run: |
          pack.sh \
              "${{ matrix.project }}" \
              --build true \
              --define "${{ inputs.preprocessor-symbols }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}" \
              --reason "${{ needs.compute-version.outputs.reason }}"

      - name: Upload package artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ needs.compute-version.outputs.release-tag }}-${{ hashFiles(matrix.project) }}
          path: ${{ steps.package.outputs.package-output-path }}/*.nupkg
          if-no-files-found: error
          overwrite: true

  collect-artifacts:
    name: Collect package artifact IDs
    needs: package-and-publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      artifact-ids: ${{ steps.collect.outputs.artifact-ids }}
    steps:
      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Collect artifact IDs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          artifact_ids=$(
              gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
              --paginate \
              --jq '.artifacts[] | select(.name | startswith("nuget-packages-")) | .id' |
              paste -sd, -
          )
          {
            printf "### Collected artifact IDs:\n\n"
            printf "artifact-ids=$artifact_ids\n"
          } | to_stdout

          args_to_github_output artifact_ids
