name: _prerelease (Reusable workflow)

on:
  workflow_call:
    inputs:
      package-projects:
        description: >-
          JSON array of project/solution paths to package and publish, e.g. '["src/Project1/Project1.csproj", "src/Project2/Project2.csproj"]'.
          If empty array, dotnet CLI will auto-detect root .sln, .slnx, or .csproj files.
        type: string

      dotnet-version:
        description: Version of .NET SDK to use (cannot be null or empty string, default 10.0.x)
        type: string
        default: 10.0.x

      preprocessor-symbols:
        description: Preprocessor symbols to pass to the compiler
        type: string
        default: ""

      minver-tag-prefix:
        description: "Prefix for git tags to be recognized by MinVer (default 'v')"
        type: string
        default: "v"

      minver-prerelease-id:
        description: Prefix for the prerelease tag, e.g. 'preview.0', 'alpha', 'beta', 'rc', etc. (cannot be null or empty string, default 'preview.0')
        type: string
        default: "preview.0"

      reason:
        description: Reason for manual pre-release
        type: string
        default: ""

      nuget-server:
        description: "NuGet server to publish to (supported values for now: 'nuget' or 'github')"
        type: string
        default: nuget

      nuget-username:
        description: "Username for the NuGet server"
        type: string

      save-package-artifacts:
        description: Upload package(s) as workflow artifacts
        type: boolean
        default: false

      sha:
        description: >-
          Exact git SHA to compute the version from and tag. When triggered automatically via
          workflow_run, pass github.event.workflow_run.head_sha to pin the prerelease to the
          CI-validated commit and prevent tagging an untested commit if another PR merges
          in the window between CI completing and this workflow running.
          Defaults to HEAD when empty (safe for manual workflow_dispatch triggers).
        type: string
        default: ""

    secrets:
      RELEASE_PAT:
        description: >-
          PAT for a user listed as a bypass actor (e.g. Admin) in the branch ruleset protecting main.
          Required to push changelog commits and version tags directly to main.
        required: true

      NUGET_API_KEY:
        description: >-
          Token for authentication to the selected NuGet server - must be issued by the selected nuget-server.
        required: false

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ARTIFACTS_DIR: artifacts/pack
  VERBOSE: ${{ vars.VERBOSE || false }}

jobs:
  compute-version:
    name: Compute Prerelease Version
    runs-on: ubuntu-latest
    outputs:
      prerelease-version: ${{ steps.version.outputs.prerelease-version }}
      prerelease-tag: ${{ steps.version.outputs.prerelease-tag }}
      reason: ${{ steps.version.outputs.reason }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          filter: tree:0
          token: ${{ github.token }}

      # Clone only the scripts from vm2.DevOps, so that we can run the composite
      # action .github/actions/scripts/action.yaml for both local and external calls
      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Validate and compute prerelease version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          compute-prerelease-version.sh \
              --minver-tag-prefix '${{ inputs.minver-tag-prefix }}' \
              --minver-prerelease-id '${{ inputs.minver-prerelease-id }}' \
              --reason '${{ inputs.reason }}'

  changelog-and-tag:
    name: Update CHANGELOG.md and Create Prerelease Tag
    runs-on: ubuntu-latest
    needs:
      - compute-version
    steps:
      - name: Checkout (full history on main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Verify HEAD matches the CI-validated SHA
        if: inputs.sha != ''
        shell: bash
        run: |
          source "$DEVOPS_LIB_DIR/gh_core.sh"
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "${{ inputs.sha }}" ]]; then
              error "Race condition detected: HEAD is $actual_sha but expected ${{ inputs.sha }}."
              error "Another commit was pushed to main after CI completed. Re-run the Prerelease workflow."
              exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Update CHANGELOG.md and create prerelease tag
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          release_pat='${{ secrets.RELEASE_PAT }}'
          [[ -n $release_pat ]] || error "secrets.RELEASE_PAT is not set"
          release_pat='${{ env.RELEASE_PAT }}'
          [[ -n $release_pat ]] || error "env.RELEASE_PAT is not set"
          release_pat="$RELEASE_PAT"
          [[ -n $release_pat ]] || error "RELEASE_PAT is not set"

          github_repository='${{ github.repository }}'
          [[ -n $github_repository ]] || error "github.repository is not set"
          github_repository='${{ env.GITHUB_REPOSITORY }}'
          [[ -n $github_repository ]] || error "env.GITHUB_REPOSITORY is not set"
          github_repository="$GITHUB_REPOSITORY"
          [[ -n $github_repository ]] || error "GITHUB_REPOSITORY is not set"

          exit_if_has_errors

          changelog-and-tag.sh \
              --tag "${{ needs.compute-version.outputs.prerelease-tag }}" \
              --reason "${{ needs.compute-version.outputs.reason }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}"

  package-and-publish:
    name: Publish Package (prerelease) to NuGet server
    if: fromJSON(inputs.package-projects)[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - compute-version
      - changelog-and-tag
    permissions:
      packages: write
      id-token: write # Required for authentication with the NuGet server
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.package-projects) }}
    steps:
      - name: Checkout prerelease tag (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.prerelease-tag }}
          fetch-tags: true
          fetch-depth: 0
          filter: tree:0

      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Setup .NET and the dependencies cache
        uses: vmelamed/vm2.DevOps/.github/actions/cache-dependencies@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          runner-os: ubuntu-latest
          github-token: ${{ github.token }}
          github-actor: ${{ github.actor }}

      - name: Debug OIDC claims (temporary)
        shell: bash
        run: |
          set -euo pipefail
          tok_json="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          jwt="$(echo "$tok_json" | jq -r '.value')"
          payload="$(echo "$jwt" | cut -d'.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
          echo "$payload" | jq '{repository, repository_id, repository_owner, repository_owner_id, workflow, workflow_ref, job_workflow_ref, ref, sha, actor}'

      - name: Authenticate with NuGet.org trusted publishing to get steps.nuget-login.outputs.NUGET_API_KEY
        if: inputs.nuget-server == 'nuget'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.nuget-username }}

      - name: Publish package (prerelease) to a NuGet server
        id: publish
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          nuget_api_key=${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          if [[ $nuget_server == 'nuget' && -z $nuget_api_key ]]; then
              error "steps.nuget-login.outputs.NUGET_API_KEY is not set"
          fi

          nuget_api_key=${{ secrets.NUGET_API_KEY }}
          if [[ $nuget_server != 'nuget' && -z $nuget_api_key ]]; then
              error "secrets.NUGET_API_KEY is not set"
          fi

          nuget_api_key=$NUGET_API_KEY
          [[ -n $nuget_api_key ]] || error "NUGET_API_KEY is not set"

          exit_if_has_errors

          publish-package.sh \
              "${{ matrix.project }}" \
              --define "${{ inputs.preprocessor-symbols }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}" \
              --minver-prerelease-id "${{ inputs.minver-prerelease-id }}" \
              --reason "${{ needs.compute-version.outputs.reason }}" \
              --nuget-server "${{ inputs.nuget-server }}" \
              --artifacts-saved "${{ inputs.save-package-artifacts }}" \
              --artifacts-dir "${{ env.ARTIFACTS_DIR }}"

      - name: Upload package artifact
        if: inputs.save-package-artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ needs.compute-version.outputs.prerelease-tag }}-${{ hashFiles(matrix.project) }}
          path: ${{ env.ARTIFACTS_DIR }}/*.nupkg
          if-no-files-found: ignore
          overwrite: true
