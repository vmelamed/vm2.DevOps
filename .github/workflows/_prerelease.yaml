name: _prerelease (Reusable workflow)

on:
  workflow_call:
    inputs:
      package-projects:
        description: >-
          JSON array of project/solution paths to package and publish, e.g. '["src/Project1/Project1.csproj", "src/Project2/Project2.csproj"]'.
          If empty array, dotnet CLI will auto-detect root .sln, .slnx, or .csproj files.
        type: string
        default: "[]"

      dotnet-version:
        description: Version of .NET SDK to use (cannot be null or empty string, default 10.0.x)
        type: string
        default: 10.0.x

      configuration:
        description: The type of build to produce, e.g. Release vs Debug. Cannot be null or empty!
        type: string
        default: Release

      preprocessor-symbols:
        description: Preprocessor symbols to pass to the compiler
        type: string
        default: ""

      minver-tag-prefix:
        description: "Prefix for git tags to be recognized by MinVer (default 'v')"
        type: string
        default: "v"

      minver-prerelease-id:
        description: Prefix for the prerelease tag, e.g. 'preview.0', 'alpha', 'beta', 'rc', etc. (cannot be null or empty string, default 'preview.0')
        type: string
        default: "preview.0"

      reason:
        description: Reason for manual pre-release
        type: string
        default: ""

      nuget-server:
        description: "NuGet server to publish to (supported values for now: 'nuget' or 'github')"
        type: string
        default: nuget

      nuget-username:
        description: "Username for the NuGet server"
        type: string

      sha:
        description: >-
          Exact git SHA to compute the version from and tag. When triggered automatically via
          workflow_run, pass github.event.workflow_run.head_sha to pin the prerelease to the
          CI-validated commit and prevent tagging an untested commit if another PR merges
          in the window between CI completing and this workflow running.
          Defaults to HEAD when empty (safe for manual workflow_dispatch triggers).
        type: string
        default: ""

    secrets:
      RELEASE_PAT:
        description: >-
          PAT for a user listed as a bypass actor (e.g. Admin) in the branch ruleset protecting main.
          Required to push changelog commits and version tags directly to main.
        required: true

    outputs:
      artifact-ids:
        description: >-
          Comma-separated list of artifact IDs for the uploaded package artifacts, if any.
          Empty string if no artifacts were uploaded.
        value: ${{ jobs.collect-artifacts.outputs.artifact-ids }}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ARTIFACTS_DIR: ${{ vars.ARTIFACTS_DIR || 'artifacts' }}
  CONFIGURATION: ${{ vars.CONFIGURATION || 'Release' }}
  PREPROCESSOR_SYMBOLS: ${{ vars.PREPROCESSOR_SYMBOLS || '' }}
  MINVER_TAG_PREFIX: ${{ vars.MINVER_TAG_PREFIX || 'v' }}
  MINVER_PRERELEASE_ID: ${{ vars.MINVER_PRERELEASE_ID || 'preview.0' }}
  REASON: ${{ vars.REASON || '' }}
  NUGET_SERVER: ${{ vars.NUGET_SERVER || 'nuget' }}
  NUGET_USERNAME: ${{ vars.NUGET_USERNAME || '' }}
  VERBOSE: ${{ vars.VERBOSE || false }}

jobs:
  prepare-prerelease:
    name: Compute Prerelease Version, Update CHANGELOG.md and Create Prerelease Tag
    runs-on: ubuntu-latest
    outputs:
      prerelease-version: ${{ steps.version-tag-and-changelog.outputs.prerelease-version }}
      prerelease-tag: ${{ steps.version-tag-and-changelog.outputs.prerelease-tag }}
      reason: ${{ steps.version-tag-and-changelog.outputs.reason }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT }}

      # Clone only the scripts from vm2.DevOps, so that we can run the composite
      # action .github/actions/scripts/action.yaml for both local and external calls
      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Verify HEAD matches the CI-validated SHA; Validate and compute prerelease version
        id: version-tag-and-changelog
        shell: bash
        run: |
          source "$DEVOPS_LIB_DIR/gh_core.sh"

          if [[ "${{ inputs.sha }}" != '' ]]; then
              actual_sha=$(git rev-parse HEAD)
              if [[ "${{ inputs.sha }}" != '' && "$actual_sha" != "${{ inputs.sha }}" ]]; then
                  error "Race condition detected: HEAD is $actual_sha but expected ${{ inputs.sha }}."
                  error "Another commit was pushed to main after CI completed. Re-run the Prerelease workflow."
                  exit 1
              fi
          fi
          git fetch --tags --force
          compute-prerelease-version.sh \
              --minver-tag-prefix '${{ inputs.minver-tag-prefix }}' \
              --minver-prerelease-id '${{ inputs.minver-prerelease-id }}' \
              --reason '${{ inputs.reason }}'

          # outputs: prerelease-version, prerelease-tag, reason

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Update CHANGELOG.md and create prerelease tag
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          [[ -n $RELEASE_PAT ]]       || error "secrets.RELEASE_PAT, or env.RELEASE_PAT, or RELEASE_PAT is not set"
          [[ -n $GITHUB_REPOSITORY ]] || error "github.repository(?), or env.GITHUB_REPOSITORY, or GITHUB_REPOSITORY is not set"
          exit_if_has_errors

          changelog-and-tag.sh \
              --tag "${{ steps.version-tag-and-changelog.outputs.prerelease-tag }}" \
              --reason "${{ steps.version-tag-and-changelog.outputs.reason }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}"

  package-and-publish:
    name: Publish Package (prerelease) to NuGet server and/or save package artifacts
    if: fromJSON(inputs.package-projects)[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - prepare-prerelease
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.package-projects) }}
    steps:
      - name: Checkout prerelease tag (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-prerelease.outputs.prerelease-tag }}
          fetch-tags: true
          fetch-depth: 0

      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@main

      - name: Setup .NET and the dependencies cache
        uses: vmelamed/vm2.DevOps/.github/actions/cache-dependencies@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          runner-os: ubuntu-latest
          github-token: ${{ github.token }}
          github-actor: ${{ github.actor }}

      - name: Build package (prerelease)
        id: package
        shell: bash
        run: |
          pack.sh \
              "${{ matrix.project }}" \
              --build \
              --configuration "${{ inputs.configuration }}" \
              --define "${{ inputs.preprocessor-symbols }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}" \
              --minver-prerelease-id "${{ inputs.minver-prerelease-id }}" \
              --reason "${{ needs.prepare-prerelease.outputs.reason }}" \
              --artifacts "$ARTIFACTS_DIR"

      - name: Upload package artifact
        id: upload-artifact
        # since we cannot publish to NuGet.org with OIDC we need to save the artifacts for publishing by the calling workflow.
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ needs.prepare-prerelease.outputs.prerelease-tag }}-${{ hashFiles(matrix.project) }}
          path: $ARTIFACTS_DIR/packages/*.nupkg
          if-no-files-found: error
          overwrite: true

  collect-artifacts:
    name: Collect package artifact IDs
    needs: package-and-publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      artifact-ids: ${{ steps.collect.outputs.artifact-ids }}
    steps:
      - name: Collect artifact IDs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          artifact_ids=$(
              gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | startswith("nuget-packages-")) | .id' |
              paste -sd, -
          )
          echo "artifact-ids=$artifact_ids" # to the logs
          echo "artifact-ids=$artifact_ids" >> "$GITHUB_OUTPUT"
