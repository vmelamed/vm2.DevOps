name: _prerelease (Reusable workflow)

on:
  workflow_call:
    inputs:
      package-projects:
        description: >-
          JSON array of project/solution paths to package and publish, e.g. '["src/Project1/Project1.csproj",
          "src/Project2/Project2.csproj"]'. If empty array, dotnet CLI will auto-detect root .sln, .slnx, or .csproj files.
        type: string
        default: "[]"

      preprocessor-symbols:
        description: Preprocessor symbols to pass to the compiler
        type: string
        default: ""

      minver-tag-prefix:
        description: "Prefix for git tags to be recognized by MinVer (default 'v')"
        type: string
        default: "v"

      minver-prerelease-id:
        description: >-
          Prefix for the prerelease tag, e.g. 'preview.0', 'alpha', 'beta', 'rc', etc. (cannot be null or empty string, default
          'preview.0')
        type: string
        default: "preview.0"

      reason:
        description: Reason for manual pre-release
        type: string
        default: ""

      nuget-server:
        description: "NuGet server to publish to ('nuget' or 'github')"
        type: string
        default: nuget

      nuget-username:
        description: "Username for the NuGet server"
        type: string

      sha:
        description: >-
          Exact git SHA to compute the version from and tag. When triggered automatically via workflow_run, pass
          github.event.workflow_run.head_sha to pin the prerelease to the CI-validated commit and prevent tagging an untested
          commit if another PR merges in the window between CI completing and this workflow running.
          Defaults to HEAD when empty (safe for manual workflow_dispatch triggers).
        type: string
        default: ""

    secrets:
      RELEASE_PAT:
        description: >-
          PAT for a user listed as a bypass actor (e.g. Admin) in the branch ruleset protecting main. Required to push changelog
          commits and version tags directly to main.
        required: true

    outputs:
      artifact-ids:
        description: >-
          Comma-separated list of artifact IDs for the uploaded package artifacts, if any. Empty string if no artifacts were
          uploaded.
        value: ${{ jobs.collect-artifacts.outputs.artifact-ids }}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GH_TOKEN: ${{ github.token }}
  GH_ACTOR: ${{ github.actor }}
  PREPROCESSOR_SYMBOLS: ${{ vars.PREPROCESSOR_SYMBOLS || '' }}
  MINVER_TAG_PREFIX: ${{ vars.MINVER_TAG_PREFIX || 'v' }}
  MINVER_PRERELEASE_ID: ${{ vars.MINVER_PRERELEASE_ID || 'preview.0' }}
  REASON: ${{ vars.REASON || '' }}
  NUGET_SERVER: ${{ vars.NUGET_SERVER || 'nuget' }}
  NUGET_USERNAME: ${{ vars.NUGET_USERNAME || '' }}
  VERBOSE: ${{ vars.VERBOSE || false }}

jobs:
  prepare-prerelease:
    name: Compute Prerelease Version, Update CHANGELOG.md and Create Prerelease Tag
    runs-on: ubuntu-latest
    outputs:
      prerelease-version: ${{ steps.compute-prerelease-version.outputs.prerelease-version }}
      prerelease-tag: ${{ steps.compute-prerelease-version.outputs.prerelease-tag }}
      reason: ${{ steps.compute-prerelease-version.outputs.reason }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT }}

      # Clone only the scripts from vm2.DevOps, so that we can run the composite
      # action .github/actions/scripts/action.yaml for both local and external calls
      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@big-bang

      - name: Verify HEAD matches the CI-validated SHA; Validate and compute prerelease version
        id: compute-prerelease-version
        shell: bash
        run: |
          source "$DEVOPS_LIB_DIR/gh_core.sh"

          if [[ "${{ inputs.sha }}" != '' ]]; then
              actual_sha=$(git rev-parse HEAD)
              if [[ "${{ inputs.sha }}" != '' && "$actual_sha" != "${{ inputs.sha }}" ]]; then
                  error "Race condition detected: HEAD is $actual_sha but expected ${{ inputs.sha }}."
                  error "Another commit was pushed to main after CI completed. Re-run the Prerelease workflow."
                  exit 1
              fi
          fi
          git fetch --tags --force
          compute-prerelease-version.sh \
              --minver-tag-prefix '${{ inputs.minver-tag-prefix }}' \
              --minver-prerelease-id '${{ inputs.minver-prerelease-id }}' \
              --reason '${{ inputs.reason }}'

          # outputs: prerelease-version, prerelease-tag, reason

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Update CHANGELOG.md and create prerelease tag
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          [[ -n $RELEASE_PAT ]]       || error "secrets.RELEASE_PAT, or env.RELEASE_PAT, or RELEASE_PAT is not set"
          [[ -n $GITHUB_REPOSITORY ]] || error "github.repository(?), or env.GITHUB_REPOSITORY, or GITHUB_REPOSITORY is not set"
          exit_if_has_errors

          changelog-and-tag.sh \
              --tag "${{ steps.compute-prerelease-version.outputs.prerelease-tag }}" \
              --reason "${{ steps.compute-prerelease-version.outputs.reason }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}"

  package-and-publish:
    name: Publish Prerelease Package to NuGet server and/or Save Package Artifacts
    if: fromJSON(inputs.package-projects)[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - prepare-prerelease
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.package-projects) }}
    steps:
      - name: Checkout prerelease tag (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-prerelease.outputs.prerelease-tag }}
          fetch-tags: true
          fetch-depth: 0

      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@big-bang

      - name: Setup .NET and the dependencies cache
        uses: vmelamed/vm2.DevOps/.github/actions/cache-dependencies@big-bang
        with:
          runner-os: ubuntu-latest
          github-token: ${{ github.token }}
          github-actor: ${{ github.actor }}

      - name: Build package (prerelease)
        id: package
        shell: bash
        run: |
          pack.sh \
              "${{ matrix.project }}" \
              --build true \
              --define "${{ inputs.preprocessor-symbols }}" \
              --minver-tag-prefix "${{ inputs.minver-tag-prefix }}" \
              --minver-prerelease-id "${{ inputs.minver-prerelease-id }}" \
              --reason "${{ needs.prepare-prerelease.outputs.reason }}"

      - name: Upload package artifact
        id: upload-artifact
        # since we cannot publish to NuGet.org with OIDC we need to save the artifacts for publishing by the calling workflow.
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ needs.prepare-prerelease.outputs.prerelease-tag }}-${{ hashFiles(matrix.project) }}
          path: ${{ steps.package.outputs.package-output-path }}/*.nupkg
          if-no-files-found: error
          overwrite: true

  collect-artifacts:
    name: Collect package artifact IDs
    needs: package-and-publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      artifact-ids: ${{ steps.collect.outputs.artifact-ids }}
    steps:
      - name: Setup DevOps environment variables
        uses: vmelamed/vm2.DevOps/.github/actions/setup-env@big-bang

      - name: Collect artifact IDs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          source $DEVOPS_LIB_DIR/gh_core.sh

          artifact_ids=$(
              gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
              --paginate \
              --jq '.artifacts[] | select(.name | startswith("nuget-packages-")) | .id' |
              paste -sd, -
          )
          {
            printf "### Collected artifact IDs:\n\n"
            printf "artifact-ids=$artifact_ids\n"
          } | to_stdout

          args_to_github_output artifact_ids
