name: _refresh_lockfiles (Reusable workflow)

# Reusable workflow that refreshes NuGet lock files when SDK-implicit
# packages (e.g. Microsoft.NET.ILLink.Tasks) change between runner
# SDK versions.  Opens a PR when lock files drift.

on:
  workflow_call:
    inputs:
      runner-os:
        description: Runner OS
        type: string
        default: ubuntu-latest

      base-branch:
        description: Branch to target for the PR (default repo's default branch)
        type: string
        default: ""

    secrets:
      GH_PACKAGES_TOKEN:
        description: PAT for GitHub Packages NuGet feed
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh NuGet lock files
    runs-on: ${{ inputs.runner-os }}
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      VERBOSE: ${{ vars.VERBOSE || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base-branch || github.event.repository.default_branch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Authenticate with GitHub Packages
        if: ${{ env.GH_PACKAGES_TOKEN != '' }}
        run: |
          dotnet nuget update source github.vm2 \
            --username '${{ github.actor }}' \
            --password '${{ env.GH_PACKAGES_TOKEN }}' \
            --store-password-in-clear-text

      - name: Restore with --force-evaluate
        run: dotnet restore --force-evaluate

      - name: Check for lock file changes
        id: changes
        run: |
          if git diff --quiet -- '**/packages.lock.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Lock files are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  Lock files have drifted:"
            git diff --stat -- '**/packages.lock.json'
          fi

      - name: Create pull request
        id: create-pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: chore/refresh-lockfiles
          delete-branch: true
          title: "chore(deps): Refresh NuGet lock files"
          body: |
            Automated lock file refresh triggered by SDK-implicit package drift.

            The runner's .NET SDK resolved different implicit package versions
            (e.g. `Microsoft.NET.ILLink.Tasks`) than what is recorded in the
            lock files.  This PR updates them via `dotnet restore --force-evaluate`.
          commit-message: "chore(deps): refresh NuGet lock files"
          labels: dependencies

      # Deliberately fails the run whenever a refresh PR was opened or updated. The PR above is created with
      # github.token, so GitHub's anti-recursion rule keeps it from triggering CI or AutoMerge.yaml -- it needs a
      # human (close & reopen it to run CI, then merge). A failed *scheduled* run makes GitHub email the user who
      # last edited the cron schedule, which turns this from "a PR nobody notices" into "an email you can't miss".
      # A red X here therefore means "action required", not "broken". Drop this step once the PR is opened with a
      # GitHub App token instead (see TODO: vm2-bot), at which point CI and auto-merge run on their own.
      - name: Flag that the refresh PR needs attention
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.create-pr.outputs.pull-request-operation }}
        run: |
          # Inline equivalent of gh_escape (gh_core.sh is not checked out in this job): neutralizes CR/LF/% so the
          # values cannot inject workflow commands into the runner's stdout parser.
          escape() { local _v=$1; _v=${_v//'%'/%25}; _v=${_v//$'\r'/%0D}; _v=${_v//$'\n'/%0A}; printf '%s' "$_v"; }

          printf '::error::Lock files drifted - refresh PR %s: %s. Close and reopen it to run CI, then merge.\n' \
                 "$(escape "${PR_OPERATION:-unknown}")" "$(escape "${PR_URL:-<no url>}")"
          exit 1
