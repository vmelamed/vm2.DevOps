name: Setup DevOps Environment
description: Provides access to vm2.DevOps bash scripts for CI/CD workflows

runs:
  using: composite
  steps:
    - name: Capture this action's own ref
      # github.action_ref reflects whichever action is currently executing -- if captured any
      # later than this, the nested actions/checkout step below would overwrite it with ITS OWN
      # ref ("v7") before its own `with:` block gets to read it. Must run first, before any
      # nested `uses:` step in this composite action.
      if: github.repository != 'vmelamed/vm2.DevOps'
      shell: bash
      run: echo "VM2_DEVOPS_ACTION_REF=${{ github.action_ref }}" >> "$GITHUB_ENV"

    - name: Checkout vm2.DevOps scripts
      # Clone only the scripts from vm2.DevOps and invoke functions from scripts/bash/lib
      if: github.repository != 'vmelamed/vm2.DevOps'
      uses: actions/checkout@v7
      with:
        repository: vmelamed/vm2.DevOps
        ref: ${{ env.VM2_DEVOPS_ACTION_REF }}
        path: vm2-devops
        persist-credentials: false
        sparse-checkout: |+
          scripts/bash/lib
          .github/scripts

    - name: Setup DevOps scripts
      # action .github/actions/setup-env/action.yaml to set-up environment variables in runner for both cases: vm2.DevOps local and external - non-vm2.DevOps calls
      shell: bash
      run: ${{ github.action_path }}/setup-env.sh
